apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agenticaiops-ingress
  namespace: agents-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - "api.agenticaiops.dev"
        - "app.agenticaiops.dev"
      secretName: agenticaiops-tls
  rules:
    - host: "api.agenticaiops.dev"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 443
    - host: "app.agenticaiops.dev"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
