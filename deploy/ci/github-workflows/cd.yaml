name: CD — GitOps Image Update

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  update-manifests:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Update image tags in k8s manifests
        run: |
          SHA="${{ github.sha }}"
          REGISTRY="ghcr.io/${{ github.repository_owner }}"

          # ── Gateway: standard k8s Deployment ──
          sed -i "s|image: .*/agenticaiops/gateway:.*|image: $REGISTRY/agenticaiops/gateway:$SHA|" \
            deploy/platform/gateway/deployment.yaml

          # ── Agents: kagent CRD ──
          sed -i "s|image: .*/agents:.*|image: $REGISTRY/agenticaiops/agents:$SHA|" \
            deploy/kagent/agents.yaml

          # ── SecOps agents: all 5 use the same agents image ──
          for f in deploy/kagent/secops/*.yaml; do
            sed -i "s|image: .*/agents:.*|image: $REGISTRY/agenticaiops/agents:$SHA|" "$f"
          done

      - name: Commit and push manifest updates
        run: |
          git config user.name "CI Bot"
          git config user.email "ci@agenticaiops.dev"
          git add deploy/
          if git diff --cached --quiet; then
            echo "No manifest changes — skipping commit."
          else
            git commit -m "chore: update image tags to ${{ github.sha }} [skip ci]"
            git push
          fi
