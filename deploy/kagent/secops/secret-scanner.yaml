apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: secret-scanner
  namespace: agents-prod
  labels:
    app.kubernetes.io/name: secret-scanner
    app.kubernetes.io/part-of: agenticaiops
    iso.27001/control: A.8.2
spec:
  type: BYO
  serviceAccountName: security-auditor
  byo:
    deployment:
      image: agenticaiops/agents:latest
      command: ["python", "-m", "secops.runner"]
      env:
        - name: AGENT_ROLE
          value: secret-scanner
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      schedule: "0 */6 * * *"
      ttlSecondsAfterFinished: 3600
