apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-controller
  namespace: {{ .Values.controller.namespace | default "agents-prod" }}
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: agenticaiops
spec:
  replicas: {{ .Values.controller.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: agenticaiops
    spec:
      serviceAccountName: {{ .Values.controller.serviceAccountName | default "kagent-controller" }}
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: KOPF_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
