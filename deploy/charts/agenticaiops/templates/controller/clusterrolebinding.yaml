apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.controller.serviceAccountName | default "kagent-controller" }}
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: agenticaiops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.controller.serviceAccountName | default "kagent-controller" }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controller.serviceAccountName | default "kagent-controller" }}
    namespace: {{ .Values.controller.namespace | default "agents-prod" }}
