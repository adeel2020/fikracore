apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: agents-prod
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: agenticaiops
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: agenticaiops/frontend:latest
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
