# Causal Rules configuration for Telecom Complaint Analyst (Modernized V2.2)

# 1. CORE NETWORKS & TARGET TEAMS
target_teams:
  core_ims: "artifact_store/teams_artifact/core_ims.yaml"
  core_packet: "artifact_store/teams_artifact/core_packet.yaml"
  core_udm: "artifact_store/teams_artifact/core_udm.yaml"
  core_smcs: "artifact_store/teams_artifact/core_smcs.yaml"
  it_bscs: "artifact_store/teams_artifact/it_bscs.yaml"
  it_prov: "artifact_store/teams_artifact/it_prov.yaml"
  sa_fan: "artifact_store/teams_artifact/sa_fan.yaml"
  cops_bo: "artifact_store/teams_artifact/cops_bo.yaml"
  platform_ran_team: "artifact_store/teams_artifact/platform_ran_team.yaml"

# 2. PHYSICAL NETWORK ELEMENTS
nodes:
  pcf: "artifact_store/node_artifacts/pcf.yaml"
  ugw: "artifact_store/node_artifacts/ugw.yaml"
  usn: "artifact_store/node_artifacts/usn.yaml"
  udg: "artifact_store/node_artifacts/udg.yaml"
  ntas: "artifact_store/node_artifacts/ntas.yaml"
  hss_udm: "artifact_store/node_artifacts/hss_udm.yaml"
  nokia_cdp: "artifact_store/node_artifacts/nokia_cdp.yaml"
  gnd_portal: "artifact_store/node_artifacts/gnd_portal.yaml"

# 3. BILLING & QUOTA ASSETS
resources:
  data_bundles: "artifact_store/resource/bundles.yaml#data_bundles"
  flexible_minutes_wallet: "artifact_store/resource/bundles.yaml#flexible_minutes_wallet"
  national_idd_minutes: "artifact_store/resource/bundles.yaml#national_idd_minutes"
  cug_minutes_bucket: "artifact_store/resource/bundles.yaml#cug_minutes_bucket"

# 4. CONFIGURATION CONSTRAINTS
constraints:
  Speed_CAP: "artifact_store/resource/constraints.yaml#Speed_CAP"
  APN_settings: "artifact_store/resource/constraints.yaml#APN_settings"

# 3. DIAGNOSTIC PRECHECKS & SYSTEM VERIFICATIONS
precheck_definitions:
  chk_pcf_fup_quota: "artifact_store/prechecks_artifact/chk_pcf_fup_quota.yaml"
  chk_pcf_srv_profile: "artifact_store/prechecks_artifact/chk_pcf_srv_profile.yaml"
  chk_udm_telephony_services: "artifact_store/prechecks_artifact/chk_udm_telephony_services.yaml"
  chk_udm_latching_vlr: "artifact_store/prechecks_artifact/chk_udm_latching_vlr.yaml"
  chk_udm_apn_provision: "artifact_store/prechecks_artifact/chk_udm_apn_provision.yaml"
  chk_udm_camel_csi: "artifact_store/prechecks_artifact/chk_udm_camel_csi.yaml"
  chk_udm_5g_sa: "artifact_store/prechecks_artifact/chk_udm_5g_sa.yaml"
  chk_ims_reg_status: "artifact_store/prechecks_artifact/chk_ims_reg_status.yaml"
  chk_smdp_profile: "artifact_store/prechecks_artifact/chk_smdp_profile.yaml"
  chk_bscs_status: "artifact_store/prechecks_artifact/chk_bscs_status.yaml"

# 4. CUSTOMER SYMPTOMS (Intents & FAQs)
intents:
  intent_volte_call_drop: "artifact_store/intents_artifact/intent_volte_call_drop.yaml"
  intent_esim_fail: "artifact_store/intents_artifact/intent_esim_fail.yaml"
  intent_slow_5g: "artifact_store/intents_artifact/intent_slow_5g.yaml"
  intent_roaming_fail: "artifact_store/intents_artifact/intent_roaming_fail.yaml"

# 5. GENERAL DOMAIN FALLBACKS
fallbacks:
  Network:
    keywords: ["signal", "coverage", "tower", "outage"]
    mandatory_prechecks:
      - chk_udm_latching_vlr
    escalation_target: core_smcs
  Billing:
    keywords: ["bill", "charge", "pay", "funds", "credit", "invoice", "balance"]
    mandatory_prechecks:
      - chk_bscs_status
    escalation_target: it_bscs
  Provisioning:
    keywords: ["provision", "activate", "register", "wifi"]
    mandatory_prechecks:
      - chk_bscs_status
    escalation_target: it_prov

# 6. FAQS (Frequently Asked Questions)
faqs:
  - id: faq_amazon_prime_cancel
    label: "Cancel Amazon Prime Subscription"
    keywords: ["cancel amazon prime", "unsubscribe prime", "cancel prime"]
    mandatory_prechecks:
      - chk_bscs_status
    escalation_target: it_bscs
    prohibited_routes: ["core_ims", "core_smcs"]
    fallback_domain: it_prov
    action: "Log in to du My Account app/portal, navigate to active Add-ons, and cancel Amazon Prime."
    url: "https://www.du.ae/personal/amazon-prime"

  - id: faq_amazon_prime_activate
    label: "Activate 12 Months Free Amazon Prime"
    keywords: ["activate amazon prime", "get prime", "free prime offer"]
    mandatory_prechecks:
      - chk_bscs_status
    escalation_target: it_bscs
    prohibited_routes: ["core_smcs"]
    fallback_domain: cops_bo
    action: "Send SMS keyword Prime to 9511 and register via the link."
    url: "https://www.du.ae/personal/amazon-prime"

  - id: faq_dncr
    label: "Do Not Call Registry (DNCR)"
    keywords: ["dncr", "do not call", "spam block"]
    mandatory_prechecks:
      - chk_bscs_status
    escalation_target: cops_bo
    prohibited_routes: ["core_smcs"]
    fallback_domain: it_prov
    action: "Send SMS keyword DNCR to 1012 to block spam telemarketing calls."
    url: "https://www.du.ae/do-not-call-registry"

  - id: faq_esim_replacement
    label: "eSIM Replacement & Multi-device Watch"
    keywords: ["replace sim", "esim swap", "watch esim", "multi-device"]
    mandatory_prechecks:
      - chk_smdp_profile
    escalation_target: cops_bo
    prohibited_routes: ["core_smcs"]
    fallback_domain: it_bscs
    action: "Order eSIM swap via du App, connect watch via Apple eSIM pairing flow."
    url: "https://www.du.ae/personal/esim"

# 7. TELECOM OPERATIONAL RULES & ERROR SIGNATURES
telecom_rules:
  - id: rule_3g_shutdown_roaming
    condition: "3G shutdown + VoLTE roaming registration check"
    trigger_keywords: ["roaming", "abroad", "no voice calls", "travel"]
    diagnostic_check: "chk_ims_reg_status"
    logic_expression: "USERFLAG != 1"
    message: "Destination country has shut down 3G. Subscriber must enable VoLTE on their device settings to register (USERFLAG must equal 1); otherwise only 4G data will function."
    escalation_target: "core_smcs"

  - id: rule_diameter_4010_denied
    condition: "DIAMETER_END_USER_SERVICE_DENIED (4010)"
    trigger_keywords: ["diameter 4010", "4010 error", "service denied"]
    diagnostic_check: "chk_bscs_status"
    message: "Diameter Error 4010: The OCS server explicitly denied the packet service because the prepaid data bundle is missing or has expired on the Charging System."
    escalation_target: "in_ocs"

  - id: rule_postpaid_speed_bundles
    condition: "3 Mbps / 10 Mbps speed limiting packages"
    trigger_keywords: ["3 mbps", "10 mbps", "postpaid speed", "unlimited speed cap"]
    message: "3 Mbps and 10 Mbps unlimited speed-cap profiles are strictly restricted to postpaid consumers. Verify user profile registry."
    escalation_target: "it_bscs"

  - id: rule_cap_cv31_release
    condition: "CV-31 Call Released from SCP/IN inside CAP messages"
    trigger_keywords: ["cv-31", "cv31", "cap release", "scp release"]
    diagnostic_check: "chk_udm_camel_csi"
    message: "CAP Error CV-31: Call released by the SCP/IN node. Indicates a Camel/prepaid signaling configuration routing mismatch."
    escalation_target: "in_ocs"

  - id: rule_cug_billing_issue
    condition: "Closed User Group (CUG) configuration error"
    trigger_keywords: ["cug", "closed user group", "group calls", "cug bundle"]
    message: "CUG routing/billing profile mismatch detected. Closed User Group configurations are strictly handled by the OCS Team."
    escalation_target: "in_ocs"

# 8. EXPLICIT CAUSAL PATHS
relationships:
  - source: intent_volte_call_drop
    target: ntas
    label: affects
  - source: ntas
    target: hss_udm
    label: depends_on

  - source: intent_esim_fail
    target: gnd_portal
    label: initiates_via
  - source: gnd_portal
    target: nokia_cdp
    label: triggers

  - source: intent_slow_5g
    target: pcf
    label: limits
  - source: pcf
    target: ugw
    label: provisions

  - source: intent_roaming_fail
    target: hss_udm
    label: registers_on
  - source: hss_udm
    target: ntas
    label: configures

  - source: fallback_network
    target: core_smcs
    label: fallback_owner
  - source: fallback_billing
    target: it_bscs
    label: fallback_owner
  - source: fallback_provisioning
    target: it_prov
    label: fallback_owner
