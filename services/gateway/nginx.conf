events {
    worker_connections 1024;
}

pid /tmp/nginx/nginx.pid;

http {
    client_body_temp_path /tmp/nginx 1 2;
    proxy_temp_path /tmp/nginx 1 2;
    fastcgi_temp_path /tmp/nginx 1 2;
    uwsgi_temp_path /tmp/nginx 1 2;
    scgi_temp_path /tmp/nginx 1 2;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    upstream agents {
        server agent-services-agent:8001;
    }
    server {
        listen 8080;
        server_name api.agenticaiops.com;

        location = /_auth {
            internal;
            proxy_pass http://agents/api/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location ~ ^/(api/qna|api/complaint|api/storyteller|api/rag|api/jarvis|api/auth|api/history|api/audit|api/v1/fikracore) {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://agents;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /health {
            proxy_pass http://agents/health;
        }

        location / {
            return 404;
        }
    }
}
