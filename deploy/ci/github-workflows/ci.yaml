name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Security Scan ────────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      - name: Semgrep — SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python
          auditOn: push

  # ── Lint ─────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install ruff mypy bandit
      - run: ruff check services/agents/src/
      - run: mypy services/agents/src/ --ignore-missing-imports
      - name: Bandit — Python SAST
        run: bandit -r services/agents/src/ -x tests,__pycache__ -ll

  # ── Dependency Scanning ─────────────────────────────────────────
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit — Dependency Vulnerability Scan
        run: |
          pip install pip-audit
          pip-audit --requirement services/agents/pyproject.toml --strict
        continue-on-error: true

  # ── Container Scan ──────────────────────────────────────────────
  container-scan:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build images for scanning
        run: |
          docker build -t agenticaiops/gateway:scan -f services/gateway/Dockerfile services/gateway
          docker build -t agenticaiops/agents:scan -f services/agents/Dockerfile .
      - name: Trivy — Scan Gateway
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: agenticaiops/gateway:scan
          format: sarif
          output: trivy-gateway.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Trivy — Scan Agents
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: agenticaiops/agents:scan
          format: sarif
          output: trivy-agents.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-gateway.sarif
        continue-on-error: true

  # ── Test ─────────────────────────────────────────────────────────
  test:
    needs: [lint, security-scan]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agenticaiops_test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
      qdrant:
        image: qdrant/qdrant:v1.10
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e shared/agenticaiops_shared
      - run: pip install pytest pytest-asyncio httpx
      - run: |
          DATABASE_URL=postgresql+asyncpg://postgres:test@localhost:5432/agenticaiops_test \
          QDRANT_URL=http://localhost:6333 \
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
          pytest tests/ -v --timeout=60

  # ── Build & Push ─────────────────────────────────────────────────
  build-and-push:
    needs: [test, dependency-scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build & Push Gateway
        uses: docker/build-push-action@v6
        with:
          context: services/gateway
          push: true
          tags: ${{ env.REGISTRY }}/agenticaiops/gateway:${{ env.IMAGE_TAG }},${{ env.REGISTRY }}/agenticaiops/gateway:latest
      - name: Build & Push Agents
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/agents/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/agenticaiops/agents:${{ env.IMAGE_TAG }},${{ env.REGISTRY }}/agenticaiops/agents:latest
