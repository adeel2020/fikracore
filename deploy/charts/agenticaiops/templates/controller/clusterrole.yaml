apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.controller.serviceAccountName | default "kagent-controller" }}
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: agenticaiops
rules:
  - apiGroups: [platform.agenticaiops.io]
    resources: [agentplatforms]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [platform.agenticaiops.io]
    resources: [agentplatforms/status]
    verbs: [get, patch, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, get, list, watch, update, patch, delete]
  - apiGroups: [""]
    resources: [services, configmaps, secrets, events]
    verbs: [create, get, list, watch, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [create, get, list, watch, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [create, get, list, watch, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [create, get, list, watch, update, patch, delete]
