apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tier4-postgres
  namespace: agents-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-services
      ports:
        - protocol: TCP
          port: 5432
  egress: []
