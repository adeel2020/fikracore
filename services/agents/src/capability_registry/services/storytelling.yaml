id: storytelling
name: Storytelling Service
engine: telecom_brain
description: Converts incident context into deterministic written stories, concise professional spoken summaries, audience briefs, and visual explanation payloads.
status: active
connectors:
  - gbrain
  - grafana
consumes:
  - incident_observation
  - correlation_candidate
  - causal_chain
  - supporting_evidence
  - telemetry_evidence
produces:
  - incident_story
  - spoken_incident_brief
  - audience_incident_brief
  - evidence_trace
  - visual_explanation
permissions:
  - read_operational_context
