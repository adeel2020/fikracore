apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: api-gateway
  namespace: agents-prod
  labels:
    app.kubernetes.io/part-of: agenticaiops
spec:
  type: BYO
  serviceAccountName: agent-operator
  byo:
    deployment:
      image: agenticaiops/gateway:latest
      replicas: 2
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      env:
        - name: JWT_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: signing-key
      livenessProbe:
        httpGet:
          path: /health
          port: 8443
          scheme: HTTPS
        initialDelaySeconds: 10
        periodSeconds: 15
