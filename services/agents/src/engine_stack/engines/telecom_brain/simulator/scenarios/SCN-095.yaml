scenario_id: SCN-095
scenario_name: Shared Rack Power Feed Defeats Core Redundancy
reference_network:
  network_id: REF-MDO-001
  file: ../operator_model/reference_synthetic_network.yaml
scenario_explanation:
  problem_statement: Redundant NFs share one rack-level power dependency and fail
    together.
  what_will_occur: DC-A Power Feed A experiences the root condition; effects propagate
    through modeled dependencies into 5G SA Mobile Data and mapped customer/service
    signals.
classification:
  primary_engineering_effect: POWER_SITE_ENVIRONMENTAL_COMMON_CAUSE
  secondary_effects:
  - CORRELATED_COMMON_CAUSE_FAILURE
  friendly_effect_label: Physical Shared Risk
  fcaps_primary: FAULT
  fcaps_secondary: []
  domains:
  - CRM
  - IT_CLOUD_INFRA
  affected_services:
  - 5g_sa_mobile_data
  effect_families:
    primary: POWER_SITE_ENVIRONMENTAL_COMMON_CAUSE
    secondary:
    - CORRELATED_COMMON_CAUSE_FAILURE
  friendly_effect_labels:
  - Physical Shared Risk
  difficulty_profile: L5
preconditions:
  normal_state:
  - reference synthetic network validates before scenario compilation
  - 5G SA Mobile Data is healthy before trigger
  - operational graph may be incomplete according to scenario difficulty profile
  required_entities:
  - INFRA:POWER:A
  - INFRA:DC:A
  - SA5G:UPF:003
  - CRM:TICKET:001
  required_entity_types:
  - customer_ticket_service
  - data_center
  - power_feed
  - upf
  required_relationships:
  - REL-POWER-MEMBER
  - REL-ENTITY-SITE
  - REL-CRM-TICKETS-IMPACT
  required_service_chain: 5g_sa_mobile_data
  required_failure_domains:
  - FD-POWER-A
  - FD-DC-A
hidden_reality:
  root_condition: 'Shared Rack Power Feed Defeats Core Redundancy: root condition
    at DC-A Power Feed A'
  trigger: synthetic deterministic scenario trigger with seeded timing and difficulty-specific
    imperfections
  origin_domain: IT_CLOUD_INFRA
  origin_entity: INFRA:POWER:A
  causal_propagation_chain:
  - INFRA:POWER:A
  - INFRA:DC:A
  - SA5G:UPF:003
  - CRM:TICKET:001
  hidden_dependencies: []
  actual_blast_radius:
    services:
    - 5g_sa_mobile_data
    regions:
    - REGION-NORTH
    customer_segments:
    - consumer_mobile
    - enterprise_mobile
    entity_count: 4
evidence_to_generate:
  alarms:
  - DC-A Power Feed A reports power_feed degradation
  - 5G SA Mobile Data dependent symptom alarm
  logs:
  - source-native logs show retries/timeouts near DC-A Power Feed A
  metrics:
  - latency_ms increases on the affected dependency path
  - packet_loss_pct, timeout_rate, queue_depth, or resource_saturation rises according
    to failure mechanism
  kpis:
  - 5G SA Mobile Data success rate decreases
  - customer-visible service quality falls below normal baseline
  traces_protocol_evidence:
  - protocol traces show retries, retransmissions, or failed handshakes along the
    causal path
  changes: []
  tickets_customer_signals:
  - customer tickets increase only for mapped service, region, and customer segment
  healthy_negative_evidence:
  - unaffected adjacent domain remains healthy as negative evidence
  - non-causal recent changes remain tracked as unrelated metadata
noise_and_uncertainty:
  unrelated_events:
  - seeded unrelated event in a non-causal domain
  - optional non-causal recent change for bias testing
  delayed_events:
  - root-domain evidence may arrive after downstream symptoms according to difficulty
    profile
  missing_evidence:
  - one expected signal may be absent only when source coverage permits it
  contradictory_evidence:
  - conflicting interpretation may appear only as operational evidence, never as hidden-world
    inconsistency
  topology_gaps: []
timing:
  propagation_constraints:
  - causal state changes must follow dependency path order before jitter is applied
  event_time_rules:
  - event_time follows hidden propagation with seeded jitter
  ingestion_delay_rules:
  - ingestion_time follows observability source profile delay and clock-skew behavior
recovery:
  recovery_sequence:
  - remove or mitigate root condition
  - observe dependent KPI recovery in reverse or service-specific order
  - verify no unsupported RCA certainty remains
  recovery_side_effects:
  - recovery surge, backlog flush, or transient reroute may be generated when matching
    effect family
reasoning_test:
  plausible_wrong_hypotheses:
  - first visible downstream alarm is the root cause
  - highest-severity domain is the root cause
  - recent unrelated change is causal without supporting evidence
  - 5G SA Mobile Data application fault without upstream dependency evidence
  expected_root_domain: IT_CLOUD_INFRA
  expected_root_entity: INFRA:POWER:A
  expected_terminal_state: EXPLAINED
  expected_discovery_findings: []
evaluation_assertions:
- all required entities must exist in the reference synthetic network
- every causal hop must resolve through a modeled relationship or valid service-chain
  dependency
- operational evidence must not contain root-cause labels
- customer impact must follow affected service, region, and customer segment mapping
- healthy evidence must not contradict hidden reality
- unrelated noise must remain evaluator metadata and must not become causal truth
