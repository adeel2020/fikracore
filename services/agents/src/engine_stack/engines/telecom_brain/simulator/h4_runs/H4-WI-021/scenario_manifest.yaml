what_if_id: H4-WI-021
title: Primary UPF Failure with 70% Backup Capacity
description: Simulates failover to secondary UPF that only supports 70 percent of
  peak traffic.
cohort: failover_capacity
trigger:
  canonical_id: SA5G:UPF:001
  entity_display_name: User Plane Function-01
  event_type: FAILURE
  severity: CRITICAL
assumptions:
  failover_available: true
  failover_capacity: LIMITED
  duration_minutes: 30
  traffic_load_profile: PEAK
failure_domain_tags:
- capacity
- failover
- bottleneck
