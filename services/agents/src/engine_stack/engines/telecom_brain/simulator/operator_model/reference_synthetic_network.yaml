  - missing_topology
  - suppressed_alarms
  - incomplete_source_coverage
  - conflicting_inventory
  - unrelated_changes
  - overlapping_incidents
  - partial_monitoring_outage
  - stale_dashboard_values
  - vendor_severity_mismatch
  - contradictory_domain_interpretation

difficulty_profiles:
  - level: L1
    name: Clean
    features: [complete_topology, minimal_noise, aligned_clocks, clear_root_evidence]
  - level: L2
    name: Noisy
    features: [duplicates, unrelated_alarms, delayed_events, small_telemetry_gaps]
  - level: L3
    name: Multi-Vendor
    features: [different_naming, different_severity, alias_mismatch, source_specific_evidence_schemas]
  - level: L4
    name: Incomplete Knowledge
    features: [missing_topology, stale_topology, incomplete_observability, ambiguous_changes, hidden_dependencies]
  - level: L5
    name: Complex Operator Reality
    features: [multiple_incidents, bad_timestamps, conflicting_evidence, transient_topology, human_disagreement, hidden_common_dependency, recovery_side_effects]

