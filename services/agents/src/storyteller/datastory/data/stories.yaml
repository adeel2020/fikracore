sop_framework:
  target_audience: "L1/L2 Customer Operations"
  purpose: "Empower Customer Operations using BO tools to filter and resolve issues without unnecessary escalation to SOC/Technical Core."
  categories:
    - name: "Packet Core & Policy Issues"
      issues:
        - name: "Device APN issue"
          count: 638
          description: "The User Equipment (UE) is attempting to attach to the network using an incorrect or unauthorized Access Point Name (APN), resulting in a PGW/SMF rejection."
          custops_check: "Use BO tools to query the subscriber's active session or HSS/UDM profile to verify the provisioned APNs versus the APN being requested."
          caveats: "Sometimes the default APN is correct, but a secondary PDP context (like IMS or tethering) is failing, masking the primary issue."
          tie_breaker: "If the APN in the BO tool matches the handset exactly, but data still fails, the issue is likely a blocked IP pool or firewall rule—escalate to Core. If there is a mismatch, the issue is user/device side—do not escalate."
          validation_steps:
            - "Verify APN spelling in UE."
            - "Reset network settings."
            - "Toggle airplane mode to force a new attach request."
          handset_cause: "OS updates (especially iOS carrier bundle updates or Android custom ROMs) can overwrite APN settings. Dual-SIM phones frequently assign the wrong APN to the secondary SIM."
        
        - name: "PCF mismatch"
          count: 57
          description: "A synchronization failure between the CRM/Billing system and the Policy Control Function (PCF/PCRF). The user has purchased a package, but the PCF has not received the correct QoS or policy rules."
          custops_check: "Cross-reference the active bundles in the CRM/Billing tool with the subscriber's active policy rules in the PCRF/PCF BO viewer."
          caveats: "API delays between Billing and PCF can cause temporary mismatches."
          tie_breaker: "If CRM shows the bundle but PCF is empty, trigger a manual profile refresh/sync via the BO tool. If the sync fails repeatedly, escalate to IT/Billing, not Core."
          validation_steps:
            - "Check CRM for active status."
            - "Trigger profile re-sync."
            - "Ask customer to restart the device to trigger a new session creation."
          handset_cause: "N/A. This is strictly a backend IT/Core sync issue, though the handset will experience it as throttling or total data loss."

        - name: "Data Allocation and Bundles"
          counts:
            Bundle not active: 22
            data bundle not active: 22
            Bundle throttling: 19
            No Data allocation: 16
          description: "The subscriber has exhausted their data quota, the bundle expired, or they have hit a Fair Usage Policy (FUP) limit, resulting in the OCS (Online Charging System) restricting the session."
          custops_check: "Access the IN/OCS BO portal to check the exact remaining byte quota and lifecycle state of the data bundle."
          caveats: "\"Ghost sessions\" (hung PDP contexts) might reserve data quota that the customer hasn't actually used."
          tie_breaker: "If the OCS shows 0 bytes, do not escalate. Inform the customer. If OCS shows available data but the user is throttled, clear the active session in the PGW/SMF via the BO tool."
          validation_steps:
            - "Verify quota in OCS."
            - "Clear hung sessions."
            - "Advise customer to purchase an add-on if depleted."
          handset_cause: "Background app refreshes, cloud backups (Google Photos/iCloud), or software updates running over cellular data can rapidly deplete bundles without the user's explicit knowledge."

    - name: "Voice and Next-Gen Core (IMS/5G)"
      issues:
        - name: "VoLTE Tag / VoLTE Not Active"
          counts:
            VoLTE Tag issue: 113
            VoLTE not active: 47
          description: "Voice over LTE (IMS) is failing either because the subscriber lacks the VoLTE provision in the HSS/UDM, or the CRM/Billing system lacks the commercial \"VoLTE Tag,\" preventing the switch from provisioning it."
          custops_check: "Check the HSS/UDM BO interface for the \"IMS\" APN and VoLTE supplementary service flags. Cross-check CRM for the commercial tag."
          caveats: "A user might have the VoLTE tag active, but their specific geographic cell site might be experiencing an eNodeB X2 handover issue, causing drops (which mimics a VoLTE failure)."
          tie_breaker: "If HSS and CRM both show VoLTE as active, check the device IMEI. If the device is not on the operator's VoLTE whitelist, do not escalate."
          validation_steps:
            - "Confirm CRM tag."
            - "Confirm HSS provisioning."
            - "Verify device IMEI whitelist."
            - "Have user toggle \"LTE/VoLTE\" in cellular settings."
          handset_cause: "The device firmware lacks the specific MNO carrier bundle required to authenticate with the IMS core, or the user manually disabled VoLTE/4G Calling in settings."

        - name: "5GSA not aligned"
          count: 25
          description: "A mismatch in 5G Standalone provisioning. The CRM might show 5G access, but the UDM lacks the SUCI (Subscription Concealed Identifier) or the 5G Core slice provisions."
          custops_check: "Verify in the UDM BO tool that 5GSA access restrictions are lifted and the default S-NSSAI is provisioned."
          caveats: "Many 5G-capable SIMs are only provisioned for NSA (Non-Standalone). SA requires a specific SIM profile upgrade (often over-the-air)."
          tie_breaker: "If UDM and CRM are aligned for 5GSA but the user cannot connect, verify if they are in a known 5GSA coverage area. If yes, escalate to Core/RAN."
          validation_steps:
            - "Check UDM for SA flags."
            - "Verify SIM card is SA-compatible (Release 15+)."
            - "Check coverage map."
          handset_cause: "The handset hardware may only support 5G NSA bands, or the manufacturer has locked 5GSA via firmware until official carrier testing is complete."

    - name: "Mobility, Roaming & Routing"
      issues:
        - name: "MNP definition mismatch"
          count: 167
          description: "Mobile Number Portability (MNP) routing failure. The number has ported, but the central STP (Signal Transfer Point) or DRA (Diameter Routing Agent) routing tables haven't updated, causing calls/SMS to route to the old operator."
          custops_check: "Use the MNP/Porting BO portal to check the exact porting timestamp and status. Query the HLR/HSS to see if the profile physically exists."
          caveats: "Inbound calls might fail while outbound calls work, or data works but SMS fails. This usually indicates a partial broadcast failure to other operators."
          tie_breaker: "If the porting window has passed and the BO tool shows \"Completed\" but the HSS profile is missing, escalate to IT/Provisioning. If HSS is built but inbound calls fail, escalate to Core Voice."
          validation_steps:
            - "Check MNP status."
            - "Verify HSS profile exists."
            - "Have user perform a test outbound call."
          handset_cause: "Extremely rare. MNP is a network-side routing protocol. The only handset issue is if the user hasn't swapped the physical SIM card yet."

        - name: "IR Not Active / Roaming Bundle Not Active"
          counts:
            IR Not Active: 111
            Roaming bundle not active: 45
          description: "The subscriber is trying to attach to a VPLMN (Visited PLMN) abroad, but the HSS/UDM has an active Roaming Bar (ODB), or the OCS is blocking data because a specific roaming package hasn't been purchased."
          custops_check: "Check the HSS/UDM for \"Operator Determined Barring\" (ODB) flags for roaming. Check OCS for active roaming voice/data bundles."
          caveats: "Roaming might be active, but steering of roaming (SoR) OTA updates might be forcing the device to a partner network with weak coverage."
          tie_breaker: "If HSS shows roaming is allowed and bundles are active, check the VPLMN attach logs (if BO tool permits). If the partner network is rejecting, advise the user to manually select a different network. Do not escalate to SOC unless all partner networks fail."
          validation_steps:
            - "Verify HSS ODB status."
            - "Verify OCS bundle."
            - "Instruct user to disable \"Automatic Network Selection\" and choose manually."
          handset_cause: "\"Data Roaming\" toggle is switched off in the OS settings, or the handset lacks the required RF bands for the visited country (e.g., US vs. EU bands)."

    - name: "SIM & Provisioning Issues"
      issues:
        - name: "Multi SIM not allowed"
          count: 435
          description: "A network rejection occurring because the system detects an attempt to register the same MSISDN on a secondary ICCID without a valid \"Multi-SIM\" or \"Twin SIM\" service provisioned in the HSS."
          custops_check: "Verify in the CRM if the \"Multi-SIM\" VAS (Value Added Service) is active and linked to the correct secondary ICCID/EID."
          caveats: "Apple Watch cellular activations frequently trigger this if the entitlement server fails to properly link the watch's eSIM to the primary MSISDN."
          tie_breaker: "If the secondary SIM is not registered in the BO tool, do not escalate. Process a SIM swap or add the Multi-SIM VAS."
          validation_steps:
            - "Verify primary and secondary ICCIDs."
            - "Check entitlement server status (for wearables)."
          handset_cause: "The user swapping SIMs between devices too quickly can sometimes cause a temporary location update collision in the VLR, though this clears automatically."

        - name: "eSIM not active"
          count: 104
          description: "The SM-DP+ (Subscription Manager Data Preparation) server has not successfully downloaded the profile to the device's eUICC, or the EID provided during activation is incorrect."
          custops_check: "Access the eSIM BO portal to check the SM-DP+ profile status (e.g., \"Released\", \"Downloaded\", \"Installed\", \"Error\")."
          caveats: "If the status is \"Installed\" but the user has no service, they may have accidentally toggled the eSIM line off in their settings."
          tie_breaker: "If the profile is stuck in \"Released,\" send a push notification or issue a new QR code. If the BO tool shows an SM-DP+ server timeout, escalate to IT/Provisioning."
          validation_steps:
            - "Confirm user's EID matches the system."
            - "Check SM-DP+ state."
            - "Re-issue QR code."
          handset_cause: "The device is carrier-locked by the previous operator, preventing the new eSIM profile from installing, or the user deleted the profile accidentally and is trying to reuse a one-time QR code."
