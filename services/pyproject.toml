[project]
name = "agenticaiops-agents"
version = "0.1.0"
description = "AgenticAIOPs — All AI agents in one service"
requires-python = ">=3.11"
dependencies = [
    "agenticaiops-shared",
    "psutil>=7.2.2",
    "networkx>=3.1,<4",
    "pyyaml>=6.0.3",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.27",
    "fastapi>=0.115.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
fikracore = "engine_stack.engines.telecom_brain.investigation.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
voice = [
    "torch==2.2.1",
    "torchaudio==2.2.1",
    "transformers==4.57.1",
    "faster-whisper==1.2.1",
    "silero-vad==6.2.1",
    "kokoro==0.9.4",
    "misaki[en]>=0.9.4",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
]

[tool.setuptools.packages.find]
where = ["agents/src"]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["agents/src/storyteller/tests"]
pythonpath = ["agents/src"]
markers = [
    "real_ml: real ML backend integration tests (VAD/STT/TTS). Skipped unless VOICE_REAL_ML=1 and the backend/model is genuinely available.",
]
