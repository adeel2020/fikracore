apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kagent-ingress
  namespace: kagent
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: "kagent-auth-secret"
    nginx.ingress.kubernetes.io/auth-realm: "kagent Admin Access"
spec:
  tls:
    - hosts:
        - "kagent.agenticaiops.dev"
      secretName: agenticaiops-tls
  rules:
    - host: "kagent.agenticaiops.dev"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kagent-controller
                port:
                  number: 80
