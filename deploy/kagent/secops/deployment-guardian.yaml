apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: deployment-guardian
  namespace: agents-prod
  labels:
    app.kubernetes.io/name: deployment-guardian
    app.kubernetes.io/part-of: agenticaiops
    iso.27001/control: A.12.1
spec:
  type: BYO
  serviceAccountName: deployment-guardian
  byo:
    deployment:
      image: agenticaiops/agents:latest
      command: ["python", "-m", "secops.runner"]
      env:
        - name: AGENT_ROLE
          value: deployment-guardian
        - name: ARGOCD_SERVER
          value: argocd-server.argocd.svc.cluster.local:443
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      schedule: "*/5 * * * *"
      ttlSecondsAfterFinished: 300
