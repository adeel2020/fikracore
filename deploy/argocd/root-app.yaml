apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agenticaiops-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: agenticaiops
  source:
    repoURL: "https://github.com/adeelarshad/kagent"
    targetRevision: main
    path: deploy/argocd/apps
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
