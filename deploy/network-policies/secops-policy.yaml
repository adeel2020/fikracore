apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secops-agents
  namespace: agents-prod
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [deployment-guardian, secret-scanner, policy-enforcer, vulnerability-responder, compliance-auditor]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kagent-controller
  egress:
    - to:
        - ipBlock:
            cidr: 10.96.0.0/12
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
