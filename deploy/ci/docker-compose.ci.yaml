version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agenticaiops_test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
  qdrant:
    image: qdrant/qdrant:v1.10
    ports:
      - "6333:6333"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
