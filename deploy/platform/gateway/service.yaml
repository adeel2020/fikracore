apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: agents-prod
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: agenticaiops
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8443
  selector:
    app.kubernetes.io/name: api-gateway
