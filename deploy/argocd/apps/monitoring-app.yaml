apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agenticaiops-monitoring
  namespace: argocd
spec:
  project: agenticaiops
  source:
    repoURL: "https://charts.bitnami.com/bitnami"
    chart: kube-prometheus
    targetRevision: 9.3.*
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
