[project]
name = "FikraCore"
version = "0.1.0"
description = "FikraCore AIOPs — All AI agents in one service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "numpy==1.26.0",
    "networkx>=3.1,<4",
    "openai>=1.60.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.12",
    "semantic-router>=0.1.7",
    "botocore>=1.43.14",
    "pyyaml>=6.0.3",
    "cryptography>=48.0.0",
    "llama-index-core>=0.14.22",
    "llama-index-llms-openai>=0.7.9",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-vector-stores-qdrant>=0.8.8",
    "llama-index-vector-stores-pinecone>=0.8.0",
    "llama-index-vector-stores-chroma>=0.5.5",
    "llama-index-graph-stores-neo4j>=0.7.0",
    "chromadb>=1.1.1",
    "neo4j>=5.28.4",
    "llama-index-vector-stores-faiss>=0.6.0",
    "agenticaiops-shared",
    "psutil>=7.2.2",
    "crewai==1.6.1",
    "pandas>=2.3.0",
]


[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "streamlit>=1.57.0",
    "ragas>=0.0.22",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pandas==2.3.0",

]

[tool.uv.workspace]
members = [
    "shared",
    "services"
]

[tool.uv.sources]
agenticaiops-shared = { workspace = true }
