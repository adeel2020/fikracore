apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: agents-prod
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: agenticaiops
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        tier: frontend
    spec:
      serviceAccountName: agent-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: nextjs
          image: localhost/frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://api-gateway.agents-prod.svc.cluster.local"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
