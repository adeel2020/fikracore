apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agenticaiops-gateway
  namespace: argocd
spec:
  project: agenticaiops
  source:
    repoURL: "https://github.com/adeelarshad/kagent"
    targetRevision: main
    path: deploy/platform/gateway
  destination:
    server: "https://kubernetes.default.svc"
    namespace: agents-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /spec/metrics
